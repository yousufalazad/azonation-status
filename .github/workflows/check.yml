name: Check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save
        run: |
          if [ -n "$(git status --porcelain status.json)" ]; then
            git config user.name "azonation-status"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.json && git commit -qm "Status $(date -u +%FT%TZ)" && git push -q
          fi
